{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-3xl mx-auto">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Tax Filing Information</h1>
            <p class="text-gray-600 mt-1">Complete all required information to proceed with your tax filing.</p>
        </div>

        <div class="bg-white rounded-lg shadow-md overflow-hidden fade-in">
            <div class="w-full bg-gray-100 h-1.5">
                <div class="w-1/4 h-full bg-gradient-to-r from-blue-500 to-blue-600"></div>
            </div>

            <form method="POST" enctype="multipart/form-data" class="p-6">
                {% csrf_token %}

                <div class="space-y-6">
                    <!-- PAN Number -->
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-gray-700">PAN Number <span class="text-red-500">*</span></label>
                        <input type="text" name="pan_number" placeholder="Enter PAN Number" required
                               class="w-full text-sm text-gray-700 bg-white border border-gray-300 rounded-lg px-3 py-2
                                      focus:border-blue-500 focus:ring-1 focus:ring-blue-200 transition duration-200">
                    </div>

                    <!-- Name -->
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-gray-700">Name <span class="text-red-500">*</span></label>
                        <input type="text" name="name" placeholder="Enter your name" required
                               class="w-full text-sm text-gray-700 bg-white border border-gray-300 rounded-lg px-3 py-2
                                      focus:border-blue-500 focus:ring-1 focus:ring-blue-200 transition duration-200">
                    </div>

                    <!-- Tax Year Dropdown -->
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-gray-700">Tax Year <span class="text-red-500">*</span></label>
                        <select name="tax_year" required
                                class="w-full text-sm text-gray-700 bg-white border border-gray-300 rounded-lg px-3 py-2
                                       focus:border-blue-500 focus:ring-1 focus:ring-blue-200 transition duration-200">
                            <option value="" disabled selected>Select Tax Year</option>
                            {% for year in years %}
                            <option value="{{ year }}" {% if year == current_year %}selected{% endif %}>{{ year }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Income Type Dropdown -->
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-gray-700">Income Type <span class="text-red-500">*</span></label>
                        <select name="income_type" required
                                class="w-full text-sm text-gray-700 bg-white border border-gray-300 rounded-lg px-3 py-2
                                       focus:border-blue-500 focus:ring-1 focus:ring-blue-200 transition duration-200">
                            <option value="" disabled selected>Select Income Type</option>
                            <option value="Salary">Salary</option>
                            <option value="House Property">House Property</option>
                            <option value="Capital Gains">Capital Gains</option>
                            <option value="Business/Profession">Business/Profession</option>
                            <option value="Other Sources">Other Sources</option>
                        </select>
                    </div>

                    <!-- Previous Tax Filing Dropdown -->
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-gray-700">Have you filed taxes before? <span class="text-red-500">*</span></label>
                        <select name="previous_filing" required
                                class="w-full text-sm text-gray-700 bg-white border border-gray-300 rounded-lg px-3 py-2
                                       focus:border-blue-500 focus:ring-1 focus:ring-blue-200 transition duration-200">
                            <option value="" disabled selected>Select an option</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>

                <!-- Required Documents Section -->
                <div class="mt-8 space-y-6">
                    <h2 class="text-lg font-semibold text-gray-800 pb-2 border-b">Required Documents</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- PAN Card -->
                        <div class="space-y-2">
                            <label class="text-sm font-medium text-gray-700">PAN Card <span class="text-red-500">*</span></label>
                            <input type="file" name="pan_card" accept=".pdf,.jpg,.jpeg,.png" required
                                   class="block w-full text-sm text-gray-500 file:mr-2 file:py-1 file:px-3
                                          file:rounded-lg file:border-0 file:text-sm file:font-medium
                                          file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100
                                          cursor-pointer border border-gray-300 rounded-lg p-1.5">
                        </div>

                        <!-- Aadhar Card -->
                        <div class="space-y-2">
                            <label class="text-sm font-medium text-gray-700">Aadhar Card <span class="text-red-500">*</span></label>
                            <input type="file" name="aadhar_card" accept=".pdf,.jpg,.jpeg,.png" required
                                   class="block w-full text-sm text-gray-500 file:mr-2 file:py-1 file:px-3
                                          file:rounded-lg file:border-0 file:text-sm file:font-medium
                                          file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100
                                          cursor-pointer border border-gray-300 rounded-lg p-1.5">
                        </div>

                        <!-- Form 16 -->
                        <div class="space-y-2">
                            <label class="text-sm font-medium text-gray-700">Form 16 <span class="text-red-500">*</span></label>
                            <input type="file" name="form16" accept=".pdf" required
                                   class="block w-full text-sm text-gray-500 file:mr-2 file:py-1 file:px-3
                                          file:rounded-lg file:border-0 file:text-sm file:font-medium
                                          file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100
                                          cursor-pointer border border-gray-300 rounded-lg p-1.5">
                        </div>

                        <!-- Bank Statement -->
                        <div class="space-y-2">
                            <label class="text-sm font-medium text-gray-700">Bank Statement <span class="text-red-500">*</span></label>
                            <input type="file" name="bank_statement" accept=".pdf,.xlsx" required
                                   class="block w-full text-sm text-gray-500 file:mr-2 file:py-1 file:px-3
                                          file:rounded-lg file:border-0 file:text-sm file:font-medium
                                          file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100
                                          cursor-pointer border border-gray-300 rounded-lg p-1.5">
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="mt-8">
                    <button type="submit" 
                            class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white text-sm font-semibold
                                   py-2.5 rounded-lg hover:from-blue-700 hover:to-blue-800 
                                   transition duration-300 transform hover:-translate-y-0.5 hover:shadow-md">
                        Continue to Next Step
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
